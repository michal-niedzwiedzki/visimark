name: "VisiMark check"
description: "Document integrity check for Markdown: verify that a document's formulas still agree with its numbers, and fail the build if they don't."
author: "VisiMark"
branding:
  icon: "check-square"
  color: "green"

inputs:
  files:
    description: "Space-separated glob(s) of Markdown files to check (bash globstar, so ** matches across directories)."
    required: false
    default: "**/*.md"
  command:
    description: "visimark subcommand to run: check, fmt or simulate"
    required: false
    default: "check"
  args:
    description: "Extra flags for the command; each must be valid for it, e.g. --fix-dates for fmt"
    required: false
    default: ""
  # Pinned rather than `latest` so that pinning the Action ref pins the engine
  # that does the work: a consumer on `@v0.1.3` re-running an unchanged commit
  # next month gets the same verifier, and one bad publish cannot reach every
  # downstream repo at once. The cost is a fourth place the release commit has
  # to bump, so ci.yml asserts this equals packages/visimark/package.json.
  version:
    description: "visimark npm version or dist-tag to install. Defaults to the release this Action ref ships, so pinning the Action pins the engine too. Set it to `latest` to track releases as they land instead, or to `path` to run whatever `visimark` is already on PATH."
    required: false
    default: "0.4.1"

runs:
  using: "composite"
  steps:
    # Tracks the current Node LTS, never a number, per
    # .agents/rules/runtime-parity.md — enforced by ci.yml's
    # node-support-policy job.
    - uses: actions/setup-node@v7
      with:
        node-version: "lts/*"

    - name: Run visimark
      shell: bash
      env:
        VISIMARK_FILES: ${{ inputs.files }}
        VISIMARK_COMMAND: ${{ inputs.command }}
        VISIMARK_ARGS: ${{ inputs.args }}
        VISIMARK_VERSION: ${{ inputs.version }}
      run: |
        shopt -s globstar nullglob
        files=($VISIMARK_FILES)
        if [ ${#files[@]} -eq 0 ]; then
          echo "visimark-action: no files matched \"$VISIMARK_FILES\"" >&2
          exit 2
        fi
        # A `visimark` already on PATH runs only when it is the pinned
        # version, or when the caller asks for it with `version: path` (this
        # repo's dogfood.yml, which runs the workspace build of the branch
        # under test). Anything else would let an old global install stand in
        # for the engine the Action ref pins, with nothing in the log to say so.
        if [ "$VISIMARK_VERSION" = path ]; then
          if ! command -v visimark >/dev/null 2>&1; then
            echo "visimark-action: version is \"path\", but there is no visimark on PATH" >&2
            exit 2
          fi
          run=(visimark)
        elif command -v visimark >/dev/null 2>&1 &&
          [ "$(visimark --version 2>/dev/null)" = "visimark $VISIMARK_VERSION" ]; then
          run=(visimark)
        else
          run=(npx --yes "visimark@$VISIMARK_VERSION")
        fi
        echo "visimark-action: running $("${run[@]}" --version)"
        "${run[@]}" "$VISIMARK_COMMAND" $VISIMARK_ARGS "${files[@]}"
