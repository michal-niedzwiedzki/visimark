name: ci

# Branch pushes are covered by `pull_request`; restricting `push` to master and
# release tags stops every PR from running this workflow twice.
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

# No job here needs to write to the repo, releases, or any other API surface —
# they only check out code and run builds/tests.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun run build
      - run: bun test
      - name: Package the extension
        working-directory: editors/vscode
        run: bunx @vscode/vsce package --no-dependencies --out visimark.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: visimark-vsix
          path: editors/vscode/visimark.vsix

  # docs/vendor/visimark-browser.js is a committed build artifact. pages.yml
  # uploads docs/ verbatim with no build step, so nothing else in this pipeline
  # notices it drifting from packages/visimark/src/**. It did drift, silently,
  # for two releases — the deployed playground was missing three chart engines
  # the docs already documented (see docs/reviews/2026-09-15.md §2.5).
  #
  # Its own job rather than a step in `build`, because Bun has to be pinned here
  # and nowhere else: the comparison is byte-exact against an artifact produced
  # by the packageManager toolchain, so a minifier change in a newer Bun would
  # fail this check for a reason that has nothing to do with the pull request.
  # `build` keeps `latest` so the "VisiMark works on current Bun" signal stays.
  playground-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: the committed playground bundle must match the source
        run: |
          bun run --filter visimark build:playground
          if ! git diff --exit-code -- docs/vendor/; then
            echo "::error::docs/vendor/ is stale. Run 'bun run --filter visimark build:playground' and commit the result. If the diff looks like pure minifier churn rather than a real change, check that your local Bun matches packageManager in package.json."
            exit 1
          fi

  # The published CLI must run under Node, not only Bun. Build with Bun (the
  # only supported build path), then exercise the built dist/ under Node.
  acceptance-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: the built CLI runs under Node against the worked examples
        run: |
          set -e
          bin=packages/visimark/bin/visimark.js
          node "$bin" --version | grep -qE '^visimark [0-9]'
          node "$bin" check docs/example-invoice.md
          if node "$bin" check docs/example-invoice-drift.md; then
            echo "::error::drift example passed under Node; it must fail"; exit 1
          fi
          if node "$bin" check docs/example-quote-plain.md; then
            echo "::error::plain quote passed under Node; it must fail (COVERAGE)"; exit 1
          fi

      # The expression-depth cap was measured against JavaScriptCore, but V8's
      # default stack is smaller and this is the job that has Node. Both halves
      # matter: the behaviour, and the margin that makes the behaviour hold.
      - name: pathological input is refused, not a stack overflow, under Node
        run: |
          set -e
          bin=packages/visimark/bin/visimark.js
          deep=$(node -e 'const n=30000;process.stdout.write("# deep\n\n```vmark #s\nx = "+"(".repeat(n)+"1"+")".repeat(n)+"\n```\n")')
          printf '%s' "$deep" > /tmp/deep.md
          out=$(node "$bin" check /tmp/deep.md 2>&1) && rc=0 || rc=$?
          if printf '%s' "$out" | grep -q 'RangeError'; then
            echo "::error::deeply nested formula crashed the CLI under Node"
            printf '%s\n' "$out" | head -20; exit 1
          fi
          if ! printf '%s' "$out" | grep -q 'nests more than'; then
            echo "::error::no depth finding under Node; got:"; printf '%s\n' "$out" | head -20; exit 1
          fi
          [ "$rc" = 1 ] || { echo "::error::expected exit 1, got $rc"; exit 1; }

      - name: the depth cap still has stack headroom under Node
        run: node scripts/stack-headroom.mjs

  # Pack once, then install the tarball globally in two isolated environments —
  # a Node-only runner and a Bun-only container — and run the command. This is
  # the regression test for #29 (bun add -g on a machine with no Node).
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: pack the tarball
        working-directory: packages/visimark
        run: npm pack --pack-destination "$RUNNER_TEMP"
      - uses: actions/upload-artifact@v7
        with:
          name: visimark-tarball
          path: ${{ runner.temp }}/visimark-*.tgz
          if-no-files-found: error

  smoke-node:
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - uses: actions/download-artifact@v8
        with:
          name: visimark-tarball
      - name: global install under Node only
        run: |
          set -e
          if command -v bun >/dev/null 2>&1; then
            echo "::error::bun is present; smoke-node must be Node-only"; exit 1
          fi
          npm i -g ./visimark-*.tgz
          vm="$(npm prefix -g)/bin/visimark"
          "$vm" --version | grep -qE '^visimark [0-9]'
          printf '# smoke\n' > smoke.md
          "$vm" check smoke.md

  smoke-bun:
    needs: pack
    runs-on: ubuntu-latest
    container: oven/bun:latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: visimark-tarball
      - name: global install under Bun only
        run: |
          set -e
          # GitHub injects its own Node into container jobs to run JS actions.
          # Reset PATH to a clean set (plus Bun's global bin) so the launcher
          # actually exercises the Bun path, not that injected Node.
          export PATH="$(bun pm bin -g):/usr/local/bin:/usr/bin:/bin"
          if command -v node >/dev/null 2>&1; then
            echo "::error::node still on PATH; smoke-bun must be Bun-only"; exit 1
          fi
          # bun add -g needs an absolute tarball path; a relative ./x.tgz is
          # parsed as a package name.
          bun add -g "$(pwd)/$(ls visimark-*.tgz)"
          visimark --version | grep -qE '^visimark [0-9]'
          printf '# smoke\n' > smoke.md
          visimark check smoke.md
