name: dependabot-lockfile

# Dependabot's `bun` ecosystem updates package.json but does not reliably
# rewrite bun.lock in a workspace repo (dependabot-core#14223), so every bump
# PR would fail `ci`'s `bun install --frozen-lockfile` before any other check
# runs. This regenerates the lockfile on the PR branch and pushes it back.
#
# One-time setup: create a token with `contents: write` on this repo (a
# fine-grained PAT, or a GitHub App installation token) and add it as a
# *Dependabot* secret named LOCKFILE_SYNC_TOKEN — Settings -> Secrets and
# variables -> Dependabot. It has to be a Dependabot secret, not an Actions
# one: this workflow is triggered by a Dependabot PR, so only Dependabot
# secrets are in scope and the default GITHUB_TOKEN is read-only. Pushing with
# a real token (rather than GITHUB_TOKEN) is also what re-triggers `ci` on the
# corrected commit.

on:
  pull_request:

permissions:
  contents: read

jobs:
  sync:
    # Trust comes from the PR's author, which a re-run or a human push to the
    # branch cannot change. The `github.actor` half is not a trust check: only
    # a Dependabot-triggered run can read the Dependabot secret below, so any
    # other run would fail at checkout rather than skip.
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]' && startsWith(github.head_ref, 'dependabot/') # zizmor: ignore[bot-conditions]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.LOCKFILE_SYNC_TOKEN }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true
          # The Bun that reads the lockfile everywhere else, so a newer one
          # cannot rewrite it into a format the pinned one disagrees with.
          bun-version-file: package.json
      - run: bun install --lockfile-only
      - name: push bun.lock if it changed
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock is already in sync with package.json."
            exit 0
          fi
          git config user.name "dependabot[bot]"
          git config user.email "49699333+dependabot[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore(deps): sync bun.lock"
          git push
