name: release

on:
  push:
    tags: ["v*"]
  # Manual runs re-check every registry and backfill whatever is missing for the
  # versions currently in the package manifests. Every publish leg is guarded by
  # a version-exists check, so a dispatch with nothing to do is a no-op.
  #
  # `tag` is what makes that promise whole. The GitHub Release and the issue
  # bookkeeping need a tag to point at, and a dispatch has no tag ref of its
  # own; given one, the run checks that tag out and backfills those two as well.
  # Left empty, a dispatch can only repair the three publish legs — it says so
  # in the log rather than quietly doing two thirds of the job.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to back-fill, e.g. v0.1.3. Must already exist. Leave empty to repair only the npm / Marketplace / Open VSX legs."
        required: false
        type: string

permissions:
  contents: write # cut the GitHub Release
  id-token: write # mint the OIDC token that signs the npm provenance attestation
  issues: write # close vocabulary-request issues whose primitive ships in this release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # On a dispatch with a `tag`, build that tag's tree rather than the
      # default branch: a backfill has to publish what was released, not what
      # master happens to hold now.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0 # the vocab issue-close step walks history back to the previous tag
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - run: bun test

      # The tag the tag-gated steps below work from: the dispatch input if one
      # was given, else the pushed tag. Anything else — a dispatch with no input
      # — leaves it empty, and those steps skip with the reason on the log
      # instead of being silently absent.
      - name: Resolve the effective tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag=""
          fi
          if [ -n "$tag" ] && ! git rev-parse -q --verify "refs/tags/$tag^{commit}" >/dev/null; then
            # fetch-depth: 0 brings every tag with it, so a tag that is missing
            # here does not exist on the remote either. Fix the input rather
            # than relaxing this check: the issue-close step's ancestry walk
            # would otherwise compare against nothing and close nothing.
            echo "::error file=.github/workflows/release.yml::tag '$tag' does not exist in this repository. Pass an existing tag to the workflow_dispatch input — see docs/releasing.md."
            exit 1
          fi
          if [ -z "$tag" ]; then
            echo "::warning::No tag for this run, so the GitHub Release and the request-issue bookkeeping will be skipped. Re-dispatch with the 'tag' input to backfill those too — see docs/releasing.md."
          else
            echo "Effective tag: $tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Resolve the versions to publish
        run: |
          {
            echo "ENGINE_VERSION=$(node -p "require('./packages/visimark/package.json').version")"
            echo "EXT_VERSION=$(node -p "require('./editors/vscode/package.json').version")"
            echo "EXT_NS=$(node -p "require('./editors/vscode/package.json').publisher")"
            echo "EXT_NAME=$(node -p "require('./editors/vscode/package.json').name")"
          } >> "$GITHUB_ENV"

      # Every publish leg below asks the registry whether this exact version is
      # already there, and publishes or skips on that answer. None of them reads
      # "already published" off a command's exit code: an unexpected failure has
      # to fail the job, not be mistaken for a no-op.
      #
      # `continue-on-error` does not soften that. Because the legs are
      # independent and idempotent, one of them erroring is no reason to strand
      # the others — v0.1.3 lost Open VSX, the GitHub Release and the issue
      # bookkeeping to a Marketplace credential problem none of them shared. So
      # each leg records its outcome, the run carries on, and "every leg must
      # have landed" at the end turns any recorded failure back into a failed
      # job. The only dependency that is real is the .vsix: the two extension
      # registries and the GitHub Release consume the file "Package the
      # extension" produces, so they are gated on it rather than on `always()`.
      - name: Publish the engine to npm
        id: npm
        continue-on-error: true
        working-directory: packages/visimark
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if npm view "visimark@$ENGINE_VERSION" version >/dev/null 2>&1; then
            echo "visimark@$ENGINE_VERSION is already on npm; skipping."
          else
            npm publish --provenance --access public
          fi

      - name: Publish the remark plugin to npm
        id: remark-plugin
        continue-on-error: true
        working-directory: packages/remark-visimark
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if npm view "remark-lint-visimark@$ENGINE_VERSION" version >/dev/null 2>&1; then
            echo "remark-lint-visimark@$ENGINE_VERSION is already on npm; skipping."
          else
            npm publish --provenance --access public
          fi

      - name: Publish the markdownlint rule to npm
        id: markdownlint-rule
        continue-on-error: true
        working-directory: packages/markdownlint-visimark
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if npm view "markdownlint-rule-visimark@$ENGINE_VERSION" version >/dev/null 2>&1; then
            echo "markdownlint-rule-visimark@$ENGINE_VERSION is already on npm; skipping."
          else
            npm publish --provenance --access public
          fi

      - name: Publish the MCP server to npm
        id: mcp-server
        continue-on-error: true
        working-directory: packages/visimark-mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if npm view "visimark-mcp@$ENGINE_VERSION" version >/dev/null 2>&1; then
            echo "visimark-mcp@$ENGINE_VERSION is already on npm; skipping."
          else
            npm publish --provenance --access public
          fi

      # The official MCP registry is how an agent discovers this server at all;
      # npm is only where the bytes live. The namespace is proven by GitHub
      # login and is independent of the `visimark_` tool-name prefix, so a
      # later move to a domain-verified namespace changes this entry and not a
      # single tool name.
      - name: Publish to the MCP registry
        id: mcp-registry
        continue-on-error: true
        # Only after the bytes are on npm: the registry entry points at an npm
        # package, and an entry for a version npm does not have is a listing
        # that fails for every agent that follows it.
        if: steps.mcp-server.outcome == 'success'
        run: |
          set -e
          if curl -sS "https://registry.modelcontextprotocol.io/v0/servers?search=visimark" \
            | grep -q "\"version\"[[:space:]]*:[[:space:]]*\"$ENGINE_VERSION\""; then
            echo "the MCP registry already has visimark $ENGINE_VERSION; skipping."
            exit 0
          fi
          # server.json's two version fields are rewritten from the tag rather
          # than trusted: the committed value documents the shape, and a stale
          # one would publish a registry entry pointing at a version that is
          # not what just went to npm. It is not in ci.yml's version-agreement
          # check because it is not a package manifest.
          bun -e '
            const fs = require("fs");
            const doc = JSON.parse(fs.readFileSync("server.json", "utf8"));
            doc.version = process.env.ENGINE_VERSION;
            for (const pkg of doc.packages) pkg.version = process.env.ENGINE_VERSION;
            fs.writeFileSync("server.json", JSON.stringify(doc, null, 2) + "\n");
          '
          curl -sSL -o /tmp/mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/').tar.gz"
          tar -xzf /tmp/mcp-publisher.tar.gz -C /tmp mcp-publisher
          /tmp/mcp-publisher login github-oidc
          /tmp/mcp-publisher publish

      - name: Package the extension
        id: package
        continue-on-error: true
        working-directory: editors/vscode
        run: bunx @vscode/vsce package --no-dependencies --out visimark.vsix

      - name: Publish to the VS Code Marketplace
        id: marketplace
        if: steps.package.outcome == 'success'
        continue-on-error: true
        working-directory: editors/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          # Azure DevOps' Gallery API occasionally leaves a request unanswered
          # for minutes instead of rejecting it — a transient service issue,
          # not a credential one (a bad token is refused in seconds with
          # TF400813). https://github.com/microsoft/vsmarketplace/issues/2167.
          # Retry both calls before treating a timeout as a real failure.
          retry() { for _ in 1 2 3; do if "$@"; then return 0; fi; echo "::warning::attempt failed, retrying in 30s..." >&2; sleep 30; done; return 1; }

          # `vsce show --json` exits 0 whether or not the extension exists (it
          # prints "undefined" when it doesn't); a non-zero exit surviving the
          # retries is a real error, so it fails the step below rather than
          # falling through to a publish attempt. On success the parsed
          # version list decides: a version not listed means the publish runs.
          show_ext() { bunx @vscode/vsce show "$EXT_NS.$EXT_NAME" --json >/tmp/marketplace.json 2>/dev/null; }
          if ! retry show_ext; then
            echo "::error::'vsce show' kept failing after retries — see the log above for the cause."
            exit 1
          fi
          if node -e 'const fs=require("fs"); let d; try { d = JSON.parse(fs.readFileSync("/tmp/marketplace.json","utf8")) } catch { process.exit(1) } process.exit((d.versions||[]).some(v => v.version === process.env.EXT_VERSION) ? 0 : 1)'; then
            echo "$EXT_NS.$EXT_NAME@$EXT_VERSION is already on the Marketplace; skipping."
          else
            retry bunx @vscode/vsce publish --no-dependencies --packagePath visimark.vsix
          fi

      - name: Publish to Open VSX
        id: ovsx
        if: steps.package.outcome == 'success'
        continue-on-error: true
        working-directory: editors/vscode
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          # The namespace has to exist before the first publish, and Open VSX
          # has no create-if-absent. Check for it, and create it only when it is
          # genuinely missing — rather than running create-namespace every time
          # and swallowing the error when it is already there.
          if [ "$(curl -sS -o /dev/null -w '%{http_code}' "https://open-vsx.org/api/$EXT_NS")" = "404" ]; then
            bunx ovsx create-namespace "$EXT_NS" -p "$OVSX_PAT"
          fi
          if [ "$(curl -sS -o /dev/null -w '%{http_code}' "https://open-vsx.org/api/$EXT_NS/$EXT_NAME/$EXT_VERSION")" = "200" ]; then
            echo "$EXT_NS.$EXT_NAME@$EXT_VERSION is already on Open VSX; skipping."
          else
            bunx ovsx publish visimark.vsix -p "$OVSX_PAT"
          fi

      # Needs both a tag to hang the release off and the .vsix to attach, and
      # nothing else — a marketplace credential problem is not a reason to
      # withhold it. `action-gh-release` is idempotent on an existing release,
      # so a backfill dispatch repairs a missing one and leaves a present one.
      - name: GitHub Release
        id: ghrelease
        if: steps.tag.outputs.tag != '' && steps.package.outcome == 'success'
        continue-on-error: true
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: editors/vscode/visimark.vsix
          body_path: CHANGELOG.md
          generate_release_notes: true

      # An approved request is implemented on a branch named
      # `vocab/issue-<n>-<slug>-impl` (vocabulary) or `issue/<n>-<slug>-impl`
      # (general), and its issue is left open until the change ships. Close each
      # such issue whose implementation PR merged into this release. "Issue
      # still open" is the guard, so a workflow_dispatch backfill or a re-run is
      # a no-op. It needs a tag and nothing else, so it runs whatever the
      # publish legs did: the comment it leaves points at the tag, and a leg
      # that still has to be backfilled does not un-ship the change. v0.1.3 is
      # the argument — bookkeeping that only happens when all three registries
      # cooperate is bookkeeping that gets done by hand, or missed.
      - name: Close shipped request issues
        id: issues
        if: steps.tag.outputs.tag != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          prev="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          echo "This tag: ${TAG}. Previous tag: ${prev:-<none>}."
          gh pr list --state merged --base master --limit 200 \
            --json number,headRefName,mergeCommit \
            --jq '.[] | select(.headRefName | test("^(vocab/issue-|issue/)[0-9]+-.+-impl$")) | [.headRefName, .mergeCommit.oid] | @tsv' \
          | while IFS="$(printf '\t')" read -r branch sha; do
              [ -n "$sha" ] || continue
              # only PRs whose merge commit is actually in this release
              git merge-base --is-ancestor "$sha" "$TAG" 2>/dev/null || continue
              if [ -n "$prev" ] && git merge-base --is-ancestor "$sha" "$prev" 2>/dev/null; then
                continue # shipped in an earlier release already
              fi
              n="${branch#vocab/issue-}"; n="${n#issue/}"; n="${n%%-*}"
              state="$(gh issue view "$n" --repo "$REPO" --json state --jq .state 2>/dev/null || echo MISSING)"
              if [ "$state" = "OPEN" ]; then
                echo "Closing #$n (impl branch $branch)"
                gh issue close "$n" --repo "$REPO" --reason completed \
                  --comment "Shipped in [\`${TAG}\`](https://github.com/${REPO}/releases/tag/${TAG})."
              else
                echo "#$n is $state — skipping"
              fi
            done

      # The verdict. Two halves, because a green run has twice told this repo
      # something false: v0.1.1 went green with both marketplace legs empty, and
      # v0.1.3's failure sat unnoticed for a day with npm ahead of Open VSX.
      #
      # First, any leg that recorded a failure above fails the job here — that
      # is what buys the legs the right to continue past each other, and it is
      # why `continue-on-error` is not a softening. Second, ask all three
      # registries whether the versions are actually there — npm once per
      # published package, since a gate that asks only about the engine lets a
      # silently-empty plugin publish pass: the same "ask the registry, don't
      # trust the exit code" discipline each leg uses, applied once at the end
      # as an assertion rather than a branch, so a leg that exits 0 without
      # publishing cannot pass for done.
      #
      # No `set -e`: every check below is explicitly tested and accumulated into
      # `fail`, so one missing package or registry still reports the others.
      - name: every leg must have landed
        env:
          NPM_OUTCOME: ${{ steps.npm.outcome }}
          REMARK_PLUGIN_OUTCOME: ${{ steps.remark-plugin.outcome }}
          MARKDOWNLINT_RULE_OUTCOME: ${{ steps.markdownlint-rule.outcome }}
          MCP_SERVER_OUTCOME: ${{ steps.mcp-server.outcome }}
          MCP_REGISTRY_OUTCOME: ${{ steps.mcp-registry.outcome }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          MARKETPLACE_OUTCOME: ${{ steps.marketplace.outcome }}
          OVSX_OUTCOME: ${{ steps.ovsx.outcome }}
          GHRELEASE_OUTCOME: ${{ steps.ghrelease.outcome }}
          ISSUES_OUTCOME: ${{ steps.issues.outcome }}
        run: |
          set -uo pipefail
          fail=0

          # A skipped leg is not a failed one: the extension legs skip when
          # packaging failed (reported on its own line), and the two tag-gated
          # steps skip on a dispatch with no tag, which is documented behaviour.
          for pair in \
            "Publish the engine to npm=$NPM_OUTCOME" \
            "Publish the remark plugin to npm=$REMARK_PLUGIN_OUTCOME" \
            "Publish the markdownlint rule to npm=$MARKDOWNLINT_RULE_OUTCOME" \
            "Publish the MCP server to npm=$MCP_SERVER_OUTCOME" \
            "Publish to the MCP registry=$MCP_REGISTRY_OUTCOME" \
            "Package the extension=$PACKAGE_OUTCOME" \
            "Publish to the VS Code Marketplace=$MARKETPLACE_OUTCOME" \
            "Publish to Open VSX=$OVSX_OUTCOME" \
            "GitHub Release=$GHRELEASE_OUTCOME" \
            "Close shipped request issues=$ISSUES_OUTCOME"; do
            leg="${pair%%=*}"; outcome="${pair##*=}"
            if [ "$outcome" = failure ]; then
              echo "::error::the '$leg' step failed. The independent legs were allowed to run on; read that step's log for the cause, fix it, then re-run with 'gh workflow run release.yml -f tag=<tag>' — see docs/releasing.md."
              fail=1
            fi
          done

          # Registries can lag behind a publish they have already accepted —
          # npm has settled in low tens of seconds, the Marketplace slower —
          # so each check is retried with backoff over roughly ten minutes
          # before it is trusted. This is a last line of defence, not a poll:
          # still absent after ~10 minutes and the release really is
          # incomplete. The original 5 x 15s (75s ceiling) read a leg that was
          # still settling as one that had failed, twice in two runs.
          retry() {
            local delays=(15 15 30 30 60 60 60 90 90 90) # ~540s of backoff across 10 attempts
            if "$@"; then return 0; fi
            local attempt=1 d
            for d in "${delays[@]}"; do
              attempt=$((attempt + 1))
              echo "::warning::attempt $attempt still doesn't see it — could be a slow registry, not a failure; retrying in ${d}s..." >&2
              sleep "$d"
              if "$@"; then return 0; fi
            done
            return 1
          }

          on_npm() { npm view "visimark@$ENGINE_VERSION" version >/dev/null 2>&1; }
          on_npm_remark() { npm view "remark-lint-visimark@$ENGINE_VERSION" version >/dev/null 2>&1; }
          on_npm_markdownlint() { npm view "markdownlint-rule-visimark@$ENGINE_VERSION" version >/dev/null 2>&1; }
          on_npm_mcp() { npm view "visimark-mcp@$ENGINE_VERSION" version >/dev/null 2>&1; }
          on_mcp_registry() {
            curl -sS "https://registry.modelcontextprotocol.io/v0/servers?search=visimark" \
              | grep -q "\"version\"[[:space:]]*:[[:space:]]*\"$ENGINE_VERSION\""
          }
          on_marketplace() {
            bunx @vscode/vsce show "$EXT_NS.$EXT_NAME" --json >/tmp/verify-marketplace.json 2>/dev/null || return 1
            node -e 'const fs=require("fs"); let d; try { d = JSON.parse(fs.readFileSync("/tmp/verify-marketplace.json","utf8")) } catch { process.exit(1) } process.exit((d.versions||[]).some(v => v.version === process.env.EXT_VERSION) ? 0 : 1)'
          }
          on_ovsx() { [ "$(curl -sS -o /dev/null -w '%{http_code}' "https://open-vsx.org/api/$EXT_NS/$EXT_NAME/$EXT_VERSION")" = "200" ]; }

          if retry on_npm; then
            echo "npm has visimark@$ENGINE_VERSION."
          else
            echo "::error::npm still does not have visimark@$ENGINE_VERSION after ~10 minutes of retries — this is absence, not lag. Fix the npm leg and re-run this workflow; do not publish by hand (see docs/releasing.md)."
            fail=1
          fi

          if retry on_npm_remark; then
            echo "npm has remark-lint-visimark@$ENGINE_VERSION."
          else
            echo "::error::npm still does not have remark-lint-visimark@$ENGINE_VERSION after ~10 minutes of retries — this is absence, not lag. Fix the remark plugin leg and re-run this workflow; do not publish by hand (see docs/releasing.md)."
            fail=1
          fi

          if retry on_npm_markdownlint; then
            echo "npm has markdownlint-rule-visimark@$ENGINE_VERSION."
          else
            echo "::error::npm still does not have markdownlint-rule-visimark@$ENGINE_VERSION after ~10 minutes of retries — this is absence, not lag. Fix the markdownlint rule leg and re-run this workflow; do not publish by hand (see docs/releasing.md)."
            fail=1
          fi

          if retry on_npm_mcp; then
            echo "npm has visimark-mcp@$ENGINE_VERSION."
          else
            echo "::error::npm still does not have visimark-mcp@$ENGINE_VERSION after ~10 minutes of retries — this is absence, not lag. Fix the MCP server leg and re-run this workflow; do not publish by hand (see docs/releasing.md)."
            fail=1
          fi

          if retry on_mcp_registry; then
            echo "The MCP registry has visimark $ENGINE_VERSION."
          else
            echo "::error::the MCP registry still does not list visimark $ENGINE_VERSION after ~10 minutes of retries — this is absence, not lag. An agent that cannot discover the server has no other route to it. Fix the registry leg and re-run this workflow (see docs/releasing.md)."
            fail=1
          fi

          if retry on_marketplace; then
            echo "The Marketplace has $EXT_NS.$EXT_NAME@$EXT_VERSION."
          else
            echo "::error::the VS Code Marketplace still does not list $EXT_NS.$EXT_NAME@$EXT_VERSION after ~10 minutes of retries — this is absence, not lag. A first publish for a publisher can sit in verification for a while — check the publisher hub before assuming a credential problem — then fix the cause and re-run this workflow. Fix this check rather than deleting it: it is the only thing that noticed v0.1.3 was half-published."
            fail=1
          fi

          if retry on_ovsx; then
            echo "Open VSX has $EXT_NS.$EXT_NAME@$EXT_VERSION."
          else
            echo "::error::Open VSX still does not have $EXT_NS.$EXT_NAME@$EXT_VERSION after ~10 minutes of retries — this is absence, not lag. Fix the Open VSX leg and re-run this workflow (see docs/releasing.md)."
            fail=1
          fi

          exit $fail
