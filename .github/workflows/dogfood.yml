name: dogfood

# Runs the composite action in ./action.yml (job self-check) and the
# .pre-commit-hooks.yaml hook (job precommit-hook-self-check) against this
# repo's own worked examples, the same way an external consumer would. Neither
# is a substitute for the unit/acceptance suite — they exist to catch a broken
# interface (bad inputs, bad shell quoting, a hook definition that doesn't
# resolve) that `bun test` never exercises because it never runs the YAML.

# Branch pushes are covered by `pull_request`; restricting `push` to master and
# release tags stops every PR from running this workflow twice.
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

# Both jobs only check out code and run the surface under test against local
# fixtures — neither writes anything back.
permissions:
  contents: read

jobs:
  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # `bun install` builds this branch's CLI (root postinstall) and links it
      # into node_modules/.bin. That directory is on PATH inside `bun run`, but
      # *not* inside a composite action's plain `run:` step, so the action's
      # `command -v visimark` preference silently fell through to
      # `npx visimark@latest` — dogfooding the last published package instead
      # of the code under test. GITHUB_PATH is what makes it resolve here.
      - run: bun install --frozen-lockfile
      - run: echo "${{ github.workspace }}/node_modules/.bin" >> "$GITHUB_PATH"

      - name: the action must run this branch's CLI, not the published package
        run: |
          resolved="$(command -v visimark || true)"
          echo "visimark resolves to: ${resolved:-<nothing>}"
          if [ "$resolved" != "${{ github.workspace }}/node_modules/.bin/visimark" ]; then
            echo "::error::visimark does not resolve to this branch's build, so every check below would be dogfooding the published package. Fix the PATH wiring rather than the assertion."
            exit 1
          fi

      # Every markdown file this repo asks anyone else to trust, checked by the
      # rule the repo now ships: a table with no rules fails, and a document
      # with no arithmetic says so with `<!--vmark:no-formulas-->`.
      - name: the clean invoice and this repo's own prose must pass
        uses: ./
        with:
          files: "docs/example-invoice.md docs/tutorial.md docs/ci.md docs/tutorial/order.md docs/tutorial/capstone.md docs/tutorial/runway.md docs/visimark-design.md docs/visimark-editor-plugins-design.md docs/cli-reference.md docs/releasing.md docs/vocabulary-catalogue.md README.md CHANGELOG.md CONTRIBUTING.md skills/visimark/SKILL.md"

      - name: the drift invoice is supposed to fail
        id: drift
        continue-on-error: true
        uses: ./
        with:
          files: "docs/example-invoice-drift.md"

      - name: fail the job if the drift example stopped failing
        if: steps.drift.outcome != 'failure'
        run: |
          echo "::error::docs/example-invoice-drift.md is supposed to fail visimark check — it passed instead. Either the example was fixed by accident, or check regressed."
          exit 1

      # The plain quote has arithmetic and no rules, which is now a finding.
      # It must keep failing until someone runs `infer` on it — that is the
      # whole lesson of the example.
      - name: the plain quote is supposed to fail for having no rules
        id: plain
        continue-on-error: true
        uses: ./
        with:
          files: "docs/example-quote-plain.md"

      - name: fail the job if the plain quote stopped failing
        if: steps.plain.outcome != 'failure'
        run: |
          echo "::error::docs/example-quote-plain.md is supposed to fail visimark check with COVERAGE — it passed instead. Either rules were written into it, or the coverage rule regressed."
          exit 1

  precommit-hook-self-check:
    # Proves .pre-commit-hooks.yaml itself works, the way self-check above
    # proves the composite Action works — same shape, a different surface.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: echo "${{ github.workspace }}/node_modules/.bin" >> "$GITHUB_PATH"

      - name: the hook must run this branch's CLI, not the published package
        run: |
          resolved="$(command -v visimark || true)"
          echo "visimark resolves to: ${resolved:-<nothing>}"
          if [ "$resolved" != "${{ github.workspace }}/node_modules/.bin/visimark" ]; then
            echo "::error::visimark does not resolve to this branch's build. Fix the PATH wiring rather than the assertion."
            exit 1
          fi

      - run: pip install --user pre-commit
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: the clean invoice must pass through the published hook definition
        run: pre-commit try-repo . visimark --files docs/example-invoice.md

      - name: the drift invoice is supposed to fail through the published hook definition
        id: drift
        continue-on-error: true
        run: pre-commit try-repo . visimark --files docs/example-invoice-drift.md

      - name: fail the job if the drift example stopped failing under the hook
        if: steps.drift.outcome != 'failure'
        run: |
          echo "::error::docs/example-invoice-drift.md is supposed to fail the visimark pre-commit hook — it passed instead."
          exit 1

      - name: the repo's own dogfood config must pass over its own tracked Markdown
        run: pre-commit run --config .pre-commit-config.yaml --all-files
