name: dogfood

# Runs the composite action in ./action.yml against this repo's own worked
# examples, the same way an external consumer's workflow would call it. It
# is not a substitute for the unit/acceptance suite — it exists to catch a
# broken Action interface (bad inputs, bad shell quoting) that `bun test`
# never exercises because it never runs the YAML.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # links this branch's CLI into node_modules/.bin, so the action below
      # runs the code under test instead of the last thing published to npm.
      - run: bun install --frozen-lockfile

      # Every markdown file this repo asks anyone else to trust, checked by the
      # rule the repo now ships: a table with no rules fails, and a document
      # with no arithmetic says so with `<!--vmark:no-formulas-->`.
      - name: the clean invoice and this repo's own prose must pass
        uses: ./
        with:
          files: "docs/example-invoice.md docs/visimark-design.md docs/visimark-editor-plugins-design.md README.md CHANGELOG.md skills/visimark/SKILL.md"

      - name: the drift invoice is supposed to fail
        id: drift
        continue-on-error: true
        uses: ./
        with:
          files: "docs/example-invoice-drift.md"

      - name: fail the job if the drift example stopped failing
        if: steps.drift.outcome != 'failure'
        run: |
          echo "::error::docs/example-invoice-drift.md is supposed to fail visimark check — it passed instead. Either the example was fixed by accident, or check regressed."
          exit 1

      # The plain quote has arithmetic and no rules, which is now a finding.
      # It must keep failing until someone runs `infer` on it — that is the
      # whole lesson of the example.
      - name: the plain quote is supposed to fail for having no rules
        id: plain
        continue-on-error: true
        uses: ./
        with:
          files: "docs/example-quote-plain.md"

      - name: fail the job if the plain quote stopped failing
        if: steps.plain.outcome != 'failure'
        run: |
          echo "::error::docs/example-quote-plain.md is supposed to fail visimark check with COVERAGE — it passed instead. Either rules were written into it, or the coverage rule regressed."
          exit 1
