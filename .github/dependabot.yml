version: 2
updates:
  # GitHub Actions used by the workflows and the composite action in action.yml.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The bun workspace at the repo root (packages/* and editors/*).
  #
  # `bun`, not `npm`: the npm ecosystem updates package.json but leaves
  # bun.lock untouched (there is no package-lock.json for it to work from),
  # so every dependency bump PR failed `bun install --frozen-lockfile` in CI.
  # The `bun` ecosystem (Dependabot GA 2025-02) understands the text bun.lock.
  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
