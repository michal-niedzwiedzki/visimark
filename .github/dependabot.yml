version: 2
updates:
  # GitHub Actions used by the workflows and the composite action in action.yml.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    cooldown:
      default-days: 7

  # The bun workspace at the repo root (packages/* and editors/*).
  #
  # `bun`, not `npm`: the npm ecosystem updates package.json but leaves
  # bun.lock untouched (there is no package-lock.json for it to work from),
  # so every dependency bump PR failed `bun install --frozen-lockfile` in CI.
  # The `bun` ecosystem (Dependabot GA 2025-02) understands the text bun.lock.
  #
  # bun does not reliably rewrite bun.lock in a workspace repo
  # (dependabot-core#14223), so `.github/workflows/dependabot-lockfile.yml`
  # regenerates it on the PR branch.
  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # One PR a week for the whole workspace: fewer branches, one lockfile
    # regeneration per batch. `dependency-type` grouping is silently ignored
    # for the bun ecosystem, so match on patterns instead.
    groups:
      bun:
        patterns: ["*"]
    # A type package is an API claim, so each one sits at the runtime floor
    # it stands in for and moves with that floor, by hand, in one commit:
    # `@types/vscode` with `engines.vscode`, and `@types/node`'s major with
    # `engines.node` (minors and patches within the major are fine). An
    # unattended bump compiles against APIs the floor does not have and the
    # typecheck still passes; `scripts/check-type-floors.ts` fails CI on the
    # lockfile if one slips. (`obsidian` floats on purpose: its typings carry
    # `@since` tags, which editors/obsidian/test/since-drift.test.ts reads.)
    #
    # The four packages the root `overrides` pin (one CodeMirror copy per
    # workspace) are bumped by hand too, override and manifests together:
    # Dependabot does not read `overrides`, so its manifest bumps did nothing
    # but leave every workspace below its own declared range.
    # `scripts/check-overrides.ts` fails CI when the two disagree.
    ignore:
      - dependency-name: "@types/vscode"
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@codemirror/language"
      - dependency-name: "@codemirror/state"
      - dependency-name: "@codemirror/view"
      - dependency-name: "@lezer/highlight"
    # A freshly published version waits a week before it is proposed, so a
    # compromised release is more likely to be caught and yanked upstream
    # first.
    cooldown:
      default-days: 7
