name: Vocabulary request
description: Propose a new mapper, operator, or aggregate for the VisiMark language
title: "vocabulary: <name>"
labels: ["vocabulary"]
body:
  - type: markdown
    attributes:
      value: |
        One primitive per issue. Anything larger — a statement, a syntax form, a
        CLI change — goes on the [language feature](?template=language-feature.yml)
        form instead.

        The decision is recorded in [`docs/vocabulary-catalogue.md`](../blob/master/docs/vocabulary-catalogue.md); read its preface first.
        The maintainer reviews it with the process in [`docs/issue-runbook.md`](../blob/master/docs/issue-runbook.md).
        An accepted primitive is written down as an `FnDoc` in
        [`packages/visimark/src/lang/reference.ts`](../blob/master/packages/visimark/src/lang/reference.ts),
        which generates the function reference and the design doc's table — so
        the fields below are the fields that file requires. Answering them well
        is most of the implementation.

        A request is judged against the design doc's constraints, not against Excel:

        - it fits the shape system (mapper is scalar → scalar; reducer is vector → scalar over a bare column reference; no vector → vector);
        - its value is document-local — no locale, clock, network, ambient data, or config;
        - it adds no ambiguity — no context-dependent coercion, and every input it cannot answer for is a `TYPE` error rather than a sentinel value;
        - its precision behaviour is stated — the result's decimal width either
          derives exactly from its operands, comes from an argument, or requires
          the binding to declare one;
        - a real document needs it. A request with no motivating document is deferred by default.
  - type: input
    id: name
    attributes:
      label: Name
      description: The proposed spelling.
      placeholder: EOMONTH
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - Mapper (scalar → scalar)
        - Reducer (vector → scalar)
        - Operator
        - Sorting rule
        - Not sure
    validations:
      required: true
  - type: input
    id: signature
    attributes:
      label: Signature and shape
      description: Arguments, result type, arity, and whether it is a map or a reduce.
      placeholder: "EOMONTH(date, months) -> date   |   map, arity 2"
    validations:
      required: true
  - type: dropdown
    id: precision
    attributes:
      label: Precision behaviour
      description: >
        Where the result's decimal width comes from. Each option is one variant
        of `FnPrecision` in `packages/visimark/src/lang/reference.ts`, so an
        accepted answer is written down as data rather than translated. See the
        design doc section 7.
      options:
        - The widest operand (like + - * MIN MAX SUM ABS MOD IF)
        - Always the same width, whatever the operands (like COUNT, which is 0)
        - The value of an argument (like ROUND(x, places))
        - The width of an argument (like FLOOR(x, s), CEILING(x, s))
        - Not derivable — a binding using it must declare precision (like / AVG SQRT)
        - Not a number (a date, or a string)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What it does
      description: One or two sentences, precise enough to implement.
      placeholder: "Last day of the month `months` away from `date`."
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Worked values
      description: >
        Two or three lines, input to output, written exactly as the result would
        appear in a document — decimal places included, because that is the
        precision rule being asserted. These become the `examples` of the
        reference entry and are executed by its tests.
      placeholder: |
        EOMONTH(2026-01-15, 1)  -> 2026-02-28
        EOMONTH(2026-02-29, -1) -> 2026-01-31
      render: text
    validations:
      required: true
  - type: textarea
    id: errors
    attributes:
      label: What it refuses
      description: >
        Every input for which there is no right answer, and the finding it
        raises — a negative argument to `SQRT`, a zero divisor, a string where a
        number is expected. Constraint 3 makes each of these an error, never a
        sentinel: VisiMark has no `Infinity`, `NaN`, `#VALUE!` or empty result.
        "Nothing — every well-typed input has an answer" is a complete answer,
        if it is true.
      placeholder: "TYPE when `x` is negative — there is no decimal square root."
    validations:
      required: true
  - type: input
    id: rounding
    attributes:
      label: Rounding rule, if it has one
      description: >
        How it breaks a tie — not how wide its result is, which the precision
        field above already settles. Only `ROUND` has one today. Leave empty if
        the result is exact.
      placeholder: "half away from zero"
    validations:
      required: false
  - type: textarea
    id: document
    attributes:
      label: The real document that needs it
      description: >
        Paste the table and its vmark block, or link to a file in a repo. Show
        the binding that would use the primitive. A request with no motivating
        document is deferred by default.
      render: markdown
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Why not existing vocabulary or an input column
      description: >
        Show that a column rule, an existing function, string concatenation, or
        a human-written input cell does not already cover this. Name the
        functions you checked — the
        [function reference](../blob/master/docs/function-reference.md) is the
        full list.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraint check
      description: >
        Does it need a locale, the clock, the network, ambient data, or a
        type-coercion rule (constraints 3 and 4 in the design doc)? If it does,
        say how the value still depends only on the document's own text.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Prior art, edge cases, naming alternatives, and the related functions a reader should be pointed at.
    validations:
      required: false
