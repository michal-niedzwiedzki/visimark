# A plain `pre-commit install` wires up both stages below in one step —
# without this, the pre-push hook needs its own
# `pre-commit install --hook-type pre-push`.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: visimark
        name: visimark check
        language: system
        entry: sh scripts/precommit-visimark-check.sh
        # Scoped to the same file set dogfood.yml's "every doc in that set
        # must pass" step already trusts: every tracked doc under docs/, plus
        # the top-level ones below, minus docs/WIP/ (unfinished scratch notes
        # never meant to satisfy `check`) and the fixtures excluded below,
        # which exist to fail on purpose — each has its own dogfood.yml step
        # proving that. A doc that has no arithmetic still passes by carrying
        # `<!--vmark:no-formulas-->`; there is no other kind of exemption.
        files: ^(docs/.*\.md|README\.md|CHANGELOG\.md|CONTRIBUTING\.md|skills/visimark/SKILL\.md)$
        exclude: ^(docs/WIP/.*|docs/example-invoice-drift\.md|docs/example-quote-plain\.md|docs/example-lunch-split-drift\.md|docs/design/presentation-only-percent-display-sigil-(plan|spec)\.md)$
      - id: gen-articles
        name: regenerate article pages
        language: system
        entry: sh scripts/prepush-gen-articles-check.sh
        stages: [pre-push]
        pass_filenames: false
        # Same trigger set as the articles-pages CI job: the catalogue, the
        # generator, and anything under docs/articles/.
        files: ^(docs/articles/|scripts/gen-articles(-lib)?\.ts$)
