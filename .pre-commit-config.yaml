# A plain `pre-commit install` wires up both stages below in one step —
# without this, the pre-push hook needs its own
# `pre-commit install --hook-type pre-push`.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: visimark
        name: visimark check
        language: system
        entry: sh scripts/precommit-visimark-check.sh
        # Scoped to the same file set dogfood.yml's "every doc in that set
        # must pass" step already trusts: every tracked doc under docs/, plus
        # the top-level ones below, minus docs/WIP/ (unfinished scratch notes
        # never meant to satisfy `check`) and the fixtures excluded below,
        # which exist to fail on purpose — each has its own dogfood.yml step
        # proving that. A doc that has no arithmetic still passes by carrying
        # `<!--vmark:no-formulas-->`; there is no other kind of exemption.
        files: ^(docs/.*\.md|README\.md|CHANGELOG\.md|CONTRIBUTING\.md|skills/visimark/SKILL\.md)$
        exclude: ^(docs/WIP/.*|docs/example-invoice-drift\.md|docs/example-quote-plain\.md|docs/example-lunch-split-drift\.md|docs/design/presentation-only-percent-display-sigil-(plan|spec)\.md)$
      - id: gen-articles
        name: regenerate article pages
        language: system
        entry: sh scripts/prepush-gen-articles-check.sh
        stages: [pre-push]
        pass_filenames: false
        # Same trigger set as the articles-pages CI job: the catalogue, the
        # generator, and anything under docs/articles/.
        files: ^(docs/articles/|scripts/gen-articles(-lib)?\.ts$)
      - id: gen-playground-bundle
        name: rebuild playground bundle
        language: system
        entry: 'sh scripts/prepush-regen.sh --pin-bun "build: regenerate the playground bundle" "bun run --filter visimark build:playground" "docs/vendor/*"'
        stages: [pre-push]
        pass_filenames: false
        # Same trigger set as the playground-bundle CI job: anything the
        # bundles are built from. Skipped, not failed, on a Bun that is not
        # the pinned one — the minifier's output is version-specific.
        files: ^(packages/visimark/src/|packages/visimark/package\.json$|bun\.lock$)
      - id: gen-docs
        name: regenerate docs pages and MCP resources
        language: system
        entry: 'sh scripts/prepush-regen.sh "build: regenerate docs pages" "bun run gen:docs && bun run gen:mcp" docs/function-reference.md docs/visimark-design.md docs/tutorial.html docs/ci.html docs/simulate.html docs/mcp-server.html packages/visimark-mcp/skill.md packages/visimark-mcp/docs/'
        stages: [pre-push]
        pass_filenames: false
        # The generated-docs and mcp-resources CI jobs' inputs.
        files: ^(docs/[^/]*\.md$|docs/design/|scripts/gen-(docs|function-reference|mcp-skill)|packages/visimark/src/lang/reference\.ts$|skills/visimark/SKILL\.md$)
