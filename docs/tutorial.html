<!doctype html>

  <head>
    <meta charset="utf-8" />

    <!--
      Follow-up review §2.3. The playground carried a `default-src 'none'`
      allowlist and its four neighbours carried nothing at all, on a site
      served verbatim by GitHub Pages — which cannot send headers, so a
      <meta> policy is the only content-security control available, and it
      has to come before the first subresource.

      `script-src` grants no inline script, which is the whole reason this is
      worth having: this page's 183 lines of `<script>` moved to
      packages/visimark/src/site/, where four gates can see them, and are
      loaded from vendor/ like the playground's. A policy that still needed
      'unsafe-inline' would buy almost nothing.

      `style-src` does still carry it, for the same reason playground.html's
      does: this page's CSS is inline. An inline-style injection is a defacement, not code
      execution, so the trade is a different order of magnitude from the
      script one.

      `connect-src 'self'` is the one fetch this page makes: tutorial.md, from
      its own directory. `img-src 'self'` covers the chart the tutorial renders
      (charts/c-trend.svg), which is likewise a sibling.

      `frame-ancestors` is absent because a <meta> policy cannot carry it; on
      Pages there is nowhere to put it.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none';
               script-src 'self' https://cdnjs.cloudflare.com;
               style-src 'self' 'unsafe-inline';
               img-src 'self';
               connect-src 'self';
               base-uri 'none';
               form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta
      name="description"
      content="From a plain Markdown table to a checked document and back out to CI, one concept at a time — tables, inference, anchors, aggregates, assertions, charts and imports."

    <!--
      A viewer, not a document.

      Every word of the tutorial lives in tutorial.md. This page fetches that
      file, splits it into top-level blocks, and lays each block out as one
      grid row: source on the left, rendering on the right.

      Why paired grid rows rather than two scrolling panes with synced scroll
      positions: a grid row is as tall as its taller half, so block n on the
      left is always level with block n on the right. There is one scrollbar,
      no scroll listener, and nothing to drift. Lockstep is a consequence of
      the layout instead of a thing JavaScript has to maintain.

      Delete this file and a complete tutorial is still there in tutorial.md,
      rendering on GitHub. That is the point.

      Needs to be served over http(s) — `bun run serve`, or GitHub Pages —
      because fetch() of a local file is blocked under file://.
    -->

    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/marked/18.0.11/lib/marked.umd.min.js"
      integrity="sha512-spWXz/aNScpDSOz0auQxbzVBx6LmlxjgH7zilyCenKLGEyBje0iSJiLGsdPlrfNqFitWXRDdAXo1Bi7bonkZ6A=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>

    <style>
      :root {
        --bg: #fdfdfc;
        --fg: #1c1b19;
        --muted: #6b6862;
        --rule: #e0ddd6;
        --src-bg: #f5f3ee;
        --src-fg: #3a372f;
        --accent: #2f6f4f;
        --bar: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16161a;
          --fg: #e6e4de;
          --muted: #9a968d;
          --rule: #33333a;
          --src-bg: #1e1e24;
          --src-fg: #c9c5ba;
          --accent: #7fc4a0;
          --bar: #1b1b20;
        }
      }

      * {
        box-sizing: border-box;
      }
      html {
        scroll-padding-top: 4.5rem;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font:
          16px/1.6 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
      }

      /* ---- top bar ---- */
      .bar {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        align-items: center;
        padding: 0.6rem 1rem;
        background: var(--bar);
        border-bottom: 1px solid var(--rule);
      }
      /* Three groups, with the two sides taking an equal share of the leftover
         width, so the Table of Contents button sits on the bar's true midpoint
         whatever the title and the controls happen to measure. */
      .bar-side {
        flex: 1 1 0;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 0.9rem;
      }
      .bar-side-end {
        justify-content: flex-end;
      }
      .bar .title {
        font-weight: 600;
        /* On top of .bar-side's gap: the wordmark and the site links are two
           different things and should not read as one run of text. */
        margin-right: 1.25rem;
      }
      .bar .title a {
        color: inherit;
        text-decoration: none;
      }
      .nav {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .nav a {
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--muted);
        text-decoration: none;
        white-space: nowrap;
        padding: 2px 0;
        border-bottom: 2px solid transparent;
      }
      .nav a:hover,
      .nav a:focus-visible {
        color: var(--fg);
        border-bottom-color: var(--accent);
      }
      .modes button {
        font: inherit;
        font-size: 0.85rem;
        padding: 0.25rem 0.7rem;
        border: 1px solid var(--rule);
        background: transparent;
        color: var(--muted);
        cursor: pointer;
      }
      .modes button:first-child {
        border-radius: 4px 0 0 4px;
      }
      .modes button:last-child {
        border-radius: 0 4px 4px 0;
      }
      .modes button + button {
        border-left: 0;
      }
      .modes button[aria-pressed="true"] {
        color: var(--bg);
        background: var(--accent);
        border-color: var(--accent);
      }
      /* ---- table of contents ---- */
      .toc-btn {
        font: inherit;
        font-size: 0.85rem;
        font-weight: 600;
        white-space: nowrap;
        padding: 0.3rem 1rem;
        color: var(--fg);
        background: var(--bg);
        border: 1px solid var(--rule);
        border-radius: 999px;
        cursor: pointer;
      }
      .toc-btn:hover,
      .toc-btn:focus-visible {
        border-color: var(--accent);
        color: var(--accent);
      }

      /* A native <dialog> rather than a hand-rolled overlay: Esc to close,
         focus containment and the backdrop all come for free. */
      .toc {
        width: 66%;
        height: 75%;
        max-width: none;
        max-height: none;
        padding: 0;
        color: var(--fg);
        background: var(--bg);
        border: 1px solid var(--rule);
        border-radius: 8px;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.18);
        overflow: hidden;
      }
      @media (prefers-color-scheme: dark) {
        .toc {
          box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
        }
      }
      .toc::backdrop {
        background: rgba(0, 0, 0, 0.35);
      }
      .toc-inner {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      .toc-head {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 0.9rem 1.25rem;
        border-bottom: 1px solid var(--rule);
      }
      .toc-head strong {
        font-size: 1rem;
      }
      .toc-close {
        margin-left: auto;
        font: inherit;
        font-size: 1.3rem;
        line-height: 1;
        padding: 0.1rem 0.5rem;
        color: var(--muted);
        background: transparent;
        border: 1px solid transparent;
        border-radius: 4px;
        cursor: pointer;
      }
      .toc-close:hover,
      .toc-close:focus-visible {
        color: var(--fg);
        border-color: var(--rule);
      }
      .toc-list {
        flex: 1;
        overflow-y: auto;
        padding: 0.75rem 0;
      }
      .toc-list a {
        display: block;
        padding: 0.3rem 1.25rem;
        color: var(--fg);
        text-decoration: none;
        border-left: 3px solid transparent;
      }
      .toc-list a:hover,
      .toc-list a:focus-visible {
        background: var(--src-bg);
        border-left-color: var(--accent);
      }
      /* Indented by heading level, so the parts, the chapters and the
         subsections read as the outline they are. */
      .toc-list a[data-level="1"] {
        font-weight: 700;
        font-size: 1.02rem;
        margin-top: 0.7rem;
      }
      .toc-list a[data-level="2"] {
        padding-left: 2.5rem;
      }
      .toc-list a[data-level="3"] {
        padding-left: 3.9rem;
        font-size: 0.9rem;
        color: var(--muted);
      }
      .toc-list a[data-level="4"] {
        padding-left: 5.3rem;
        font-size: 0.9rem;
        color: var(--muted);
      }
      .toc-list a[data-level="5"],
      .toc-list a[data-level="6"] {
        padding-left: 6.7rem;
        font-size: 0.9rem;
        color: var(--muted);
      }

      /* ---- the lockstep grid ---- */
      main {
        max-width: 1600px;
        margin: 0 auto;
        padding: 1.5rem 1rem 6rem;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        column-gap: 1.5rem;
        row-gap: 0.2rem;
        align-items: start;
      }
      body[data-mode="rendered"] main,
      body[data-mode="source"] main {
        grid-template-columns: minmax(0, 1fr);
        max-width: 900px;
      }
      body[data-mode="rendered"] .src,
      body[data-mode="source"] .out {
        display: none;
      }

      .src {
        margin: 0;
        padding: 0.5rem 0.75rem;
        overflow-x: auto;
        background: var(--src-bg);
        color: var(--src-fg);
        border-left: 2px solid var(--rule);
        font:
          12px/1.55 ui-monospace,
          SFMono-Regular,
          Menlo,
          Consolas,
          monospace;
        white-space: pre;
        tab-size: 2;
      }
      .out {
        min-width: 0;
        padding: 0 0.25rem;
      }
      .out > :first-child {
        margin-top: 0;
      }
      .out > :last-child {
        margin-bottom: 0;
      }

      /* ---- rendered markdown ---- */
      .out h1,
      .out h2,
      .out h3 {
        line-height: 1.25;
        margin: 1.6rem 0 0.6rem;
      }
      .out h1 {
        font-size: 1.7rem;
        border-bottom: 2px solid var(--accent);
        padding-bottom: 0.3rem;
      }
      .out h2 {
        font-size: 1.3rem;
      }
      .out h3 {
        font-size: 1.05rem;
      }
      .out p,
      .out ul,
      .out ol {
        margin: 0.6rem 0;
      }
      .out a {
        color: var(--accent);
      }
      .out code {
        font:
          0.87em ui-monospace,
          SFMono-Regular,
          Menlo,
          Consolas,
          monospace;
        background: var(--src-bg);
        padding: 0.1em 0.35em;
        border-radius: 3px;
      }
      .out pre {
        background: var(--src-bg);
        padding: 0.7rem 0.85rem;
        overflow-x: auto;
        border-radius: 4px;
        border-left: 2px solid var(--accent);
      }
      .out pre code {
        background: none;
        padding: 0;
        font-size: 0.8rem;
        line-height: 1.5;
      }
      .out table {
        border-collapse: collapse;
        width: 100%;
        font-size: 0.9rem;
        margin: 0.8rem 0;
      }
      .out th,
      .out td {
        border: 1px solid var(--rule);
        padding: 0.3rem 0.5rem;
        text-align: left;
      }
      .out th {
        background: var(--src-bg);
      }
      .out blockquote {
        margin: 0.8rem 0;
        padding-left: 0.9rem;
        border-left: 3px solid var(--rule);
        color: var(--muted);
      }
      .out hr {
        border: 0;
        border-top: 1px solid var(--rule);
        margin: 2rem 0;
      }

      .note {
        grid-column: 1 / -1;
        padding: 2rem;
        color: var(--muted);
      }
      .note code {
        color: var(--fg);
      }

      @media (max-width: 700px) {
        /* 66% of a phone is not comfortable screen estate, it is a slot. */
        .toc {
          width: 92%;
          height: 85%;
        }
      }

      @media (max-width: 900px) {
        main {
          grid-template-columns: minmax(0, 1fr);
          max-width: 900px;
        }
        body[data-mode="split"] .src {
          display: none;
        }
      }
    </style>
  </head>

          <button type="button" data-set="rendered" aria-pressed="false">Rendered</button>
          <button type="button" data-set="source" aria-pressed="false">Source</button>

    <dialog class="toc" id="toc" aria-label="Table of contents">

      </div>
    </dialog>

    <main id="doc">
      <p class="note">Loading <code>tutorial.md</code>…</p>
    </main>

    <script src="vendor/visimark-site-tutorial.js"></script>
  </body>
</html>
