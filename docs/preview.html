<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!--
      Follow-up review §2.3. The playground carried a `default-src 'none'`
      allowlist and its four neighbours carried nothing at all, on a site
      served verbatim by GitHub Pages — which cannot send headers, so a
      <meta> policy is the only content-security control available, and it
      has to come before the first subresource.

      `script-src` grants no inline script, which is the whole reason this is
      worth having: this page's 70 lines of `<script>` moved to
      packages/visimark/src/site/, where four gates can see them, and are
      loaded from vendor/ like the playground's. A policy that still needed
      'unsafe-inline' would buy almost nothing.

      `style-src` does still carry it, for the same reason playground.html's
      does: this page's CSS is inline. An inline-style injection is a defacement, not code
      execution, so the trade is a different order of magnitude from the
      script one.

      `connect-src 'self'` is what `?file=` fetches — already restricted to a
      bare filename in this directory by the pattern in
      packages/visimark/src/site/preview-page.ts, which is the check review §2.3
      credited this page for. The policy is the second lock on that door.

      `frame-ancestors` is absent because a <meta> policy cannot carry it; on
      Pages there is nowhere to put it.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none';
               script-src 'self' https://cdnjs.cloudflare.com;
               style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
               font-src https://fonts.gstatic.com;
               img-src 'self';
               connect-src 'self';
               base-uri 'none';
               form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Review §2.9 — the card a pasted link renders as. The wording, the
         image and the reasoning are all in index.html's copy of this block.
         This page shows whichever example `?file=` names, so its card is the
         generic site one: a scraper never runs the script that would know
         which example it is. -->
    <meta
      name="description"
      content="A worked VisiMark example, rendered side by side with its source: the formulas, the values they produce and the prose that stays in step with them."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VisiMark" />
    <meta property="og:title" content="A VisiMark example" />
    <meta
      property="og:description"
      content="A worked VisiMark example, rendered side by side with its source: the formulas, the values they produce and the prose that stays in step with them."
    />
    <meta property="og:url" content="https://michal-niedzwiedzki.github.io/visimark/preview.html" />
    <meta
      property="og:image"
      content="https://michal-niedzwiedzki.github.io/visimark/og-card.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="VisiMark: a vmark block computing grand_total = SUM(Total), and the prose value it keeps in step"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <title>VisiMark — preview</title>
    <link rel="icon" type="image/webp" href="assets/visimark.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />
    <style>
      /* This page only: a full-length, side-by-side reading view for one
         example document, picked by the ?file= query param instead of
         building a static page per example. */
      .example-bar {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        margin: 8px 0 0;
      }
      .example-back {
        color: #b9b9b9;
        text-decoration: none;
        font-size: 0.92rem;
      }
      .example-back:hover {
        color: #f4f4f4;
      }
      .example-source-link {
        color: #b9b9b9;
        font-size: 0.9rem;
      }
      .example-source-link a {
        color: #f4f4f4;
      }
      .doc-highlight {
        margin-top: 24px;
        background: #ffffff;
        color: #1b1b1b;
        border-radius: 10px;
        padding: 24px 32px;
        box-shadow: 0 16px 50px rgba(0, 0, 0, 0.45);
      }
      .doc-highlight h2 {
        margin: 0 0 10px;
        font-size: 1.5rem;
        font-weight: 750;
      }
      .doc-highlight p {
        margin: 0 0 12px;
        font-size: 0.96rem;
        line-height: 1.6;
        color: #363636;
      }
      .doc-highlight p:last-child {
        margin-bottom: 0;
      }
      .doc-highlight code {
        background: #f0f0f0;
        border-radius: 4px;
        padding: 1px 5px;
        font-size: 0.88em;
      }
      .doc-demo {
        display: grid;
        grid-template-columns: 1fr 1fr;
        align-items: start;
        gap: 18px;
        margin-top: 20px;
      }
      .doc-pane {
        min-width: 0;
      }
      .doc-pane h4 {
        margin: 0 0 8px;
        font-size: 0.78rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #b9b9b9;
      }
      .doc-source {
        margin: 0;
        background: #1c1c1c;
        color: #e6e6e6;
        border-radius: 10px;
        padding: 18px 20px;
        font-family: "SF Mono", "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace;
        font-size: 0.78rem;
        line-height: 1.6;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .doc-preview {
        background: #ffffff;
        color: #1b1b1b;
        border-radius: 10px;
        padding: 26px 32px;
        box-shadow: 0 16px 50px rgba(0, 0, 0, 0.45);
      }
      .doc-preview h1 {
        font-size: 1.5rem;
        margin: 0 0 14px;
      }
      .doc-preview h2 {
        font-size: 1.18rem;
        margin: 26px 0 10px;
      }
      .doc-preview h3 {
        font-size: 1.02rem;
        margin: 20px 0 8px;
      }
      .doc-preview p,
      .doc-preview li {
        font-size: 0.94rem;
        line-height: 1.6;
      }
      .doc-preview p {
        margin: 0 0 12px;
      }
      .doc-preview ul,
      .doc-preview ol {
        margin: 0 0 12px;
        padding-left: 1.3rem;
      }
      .doc-preview table {
        border-collapse: collapse;
        width: 100%;
        margin: 0 0 14px;
        font-size: 0.86rem;
      }
      .doc-preview th,
      .doc-preview td {
        border: 1px solid #ddd;
        padding: 5px 9px;
      }
      .doc-preview code {
        background: #f0f0f0;
        border-radius: 4px;
        padding: 1px 5px;
        font-size: 0.88em;
      }
      .doc-preview pre {
        background: #1c1c1c;
        color: #e6e6e6;
        border-radius: 8px;
        padding: 12px 14px;
        overflow-x: auto;
        font-size: 0.78rem;
      }
      .doc-preview pre code {
        background: none;
        padding: 0;
      }
      .doc-preview img {
        max-width: 100%;
        margin: 6px 0 14px;
        background: #ffffff;
      }
      .doc-preview hr {
        border: none;
        border-top: 1px solid #e6e6e6;
        margin: 24px 0;
      }
      .doc-preview blockquote {
        margin: 0 0 12px;
        padding-left: 14px;
        border-left: 3px solid #e6e6e6;
        color: #555;
      }
      .doc-error {
        color: #ff453a;
        font-size: 0.92rem;
        margin-top: 20px;
      }
      @media (max-width: 880px) {
        .doc-demo {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="masthead">
        <a href="index.html"><img src="assets/visimark.webp" alt="VisiMark logo" /></a>
        <div>
          <h1><a href="index.html" style="color: inherit; text-decoration: none">VisiMark</a></h1>
          <p class="subtitle">the numbers in your Markdown, checked on every commit</p>
        </div>
      </header>

      <p class="example-bar">
        <a class="example-back" href="index.html#usecases">&larr; Back to VisiMark</a>
        <span class="example-source-link" id="source-link"></span>
      </p>

      <section id="doc-highlight" class="doc-highlight" hidden></section>

      <div id="doc-demo" class="doc-demo" hidden>
        <div class="doc-pane">
          <h4 id="source-label">Source</h4>
          <pre class="doc-source" id="doc-source" tabindex="0"></pre>
        </div>
        <div class="doc-pane">
          <h4>Rendered preview</h4>
          <div class="doc-preview" id="doc-preview" tabindex="0"></div>
        </div>
      </div>

      <p class="doc-error" id="doc-error" hidden></p>
    </div>

    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/marked/18.0.11/lib/marked.umd.min.js"
      integrity="sha512-spWXz/aNScpDSOz0auQxbzVBx6LmlxjgH7zilyCenKLGEyBje0iSJiLGsdPlrfNqFitWXRDdAXo1Bi7bonkZ6A=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script src="vendor/visimark-site-preview.js"></script>
  </body>
</html>
